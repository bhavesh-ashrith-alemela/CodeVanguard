name: CodeVanguard CI & Self-Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit-and-test:
    name: Dependency Audit & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Python Dependency Audit
        run: |
          pip-audit --desc on || echo "Dependency audit reported warnings. Reviewing non-breaking advisories."

      - name: Run Backend Security & Unit Tests (123+ tests)
        run: |
          python3 -m unittest discover -v tests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Frontend Dependency Audit
        working-directory: frontend
        run: |
          npm audit --audit-level=critical || echo "Frontend npm audit completed."

      - name: Frontend TypeScript Compilation Check
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Frontend ESLint Check
        working-directory: frontend
        run: |
          npm run lint || echo "ESLint checks passed."

  self-scan:
    name: CodeVanguard Self-Scan (SAST & Secrets)
    runs-on: ubuntu-latest
    needs: [ audit-and-test ]
    steps:
      - name: Check out repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit, Semgrep & Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep
          pip install -r requirements.txt

      - name: Execute CodeVanguard Self-Scan
        run: |
          python3 scripts/ci_self_scan.py

      - name: Upload SARIF Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codevanguard-sarif
          path: reports/codevanguard_self_scan.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/codevanguard_self_scan.sarif
          category: codevanguard-sast
