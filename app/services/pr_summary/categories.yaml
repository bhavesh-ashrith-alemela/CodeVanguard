auth:
  - "*auth*"
  - "*login*"
  - "*session*"
  - "*jwt*"
  - "*token*"
  - "*permission*"
  - "*role*"
  - "*oauth*"
  - "*credential*"

db:
  - "*migration*"
  - "*migrations/*"
  - "*model*"
  - "*models/*"
  - "*schema*"
  - "*sql*"
  - "*db*"
  - "*query*"
  - "*entity*"

subprocess/exec:
  - "*subprocess*"
  - "*exec*"
  - "*command*"
  - "*runner*"
  - "*shell*"
  - "*spawn*"
